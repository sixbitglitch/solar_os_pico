[flavor]
name = "picocalc-core"
description = "SolarOS terminal baseline for the Clockwork PicoCalc on a Pico Plus 2 W (RP2350)."

# Trimmed from flavors/core.toml. Only groups this port actually implements are
# enabled; see doc/ports/picocalc.md for the full deferred list and the reason
# each omission is deliberate rather than an oversight.
#
# Deliberately OFF (do not enable without reading the port doc first):
#   bluetooth             - CYW43439 BT stack not wired for this pass.
#   wireguard, slip, osc  - deferred; net stack still settling.
# SoftAP / NAT / L2 repeater return NOT_SUPPORTED on the pico Wi-Fi backend.
#   cardkb, ps2_keyboard  - replaced by the PicoCalc STM32 keyboard driver.
#   rfm69, rfm95          - no radio on this hardware.
#   midi, sump            - depend on transports/jobs not ported.
#   logic_analyzer        - depends on the SUMP capture path.
#   sdmmc                 - this port does SD over SPI, not SDIO.
#   sdspi                 - board SD driver is used instead.
#   neopixel, pcd8544,
#   ssd1683, ssd1306,
#   analog_joystick,
#   ps2_mouse, pcm5102,
#   pcm1808               - no such hardware on the PicoCalc mainboard.

[groups]
hardware_shell = true
filesystem = true
sd_storage = true
gpio = true
i2c = true
spi = true
uart = true
adc = true
pwm = true
logging = true
battery_monitor = true
wifi = true
embedded_docs = true
serial_terminal = true
editor = true
pager = true
files = true
launcher = true
io = true
clock = true
calculator = true
picocalc_keyboard = true

# Networking (needs pico lwIP + HTTP/MQTT/SSH shims)
http_client = true
web_browser = true
ssh = true
ftp = true
telnet = true
http_server = true
mqtt = true
ntp = true
webradio = true

# Scripting / games / audio
python = true
lua = true
gameboy = true
audio_support = true
audio_commands = true
player = true
recorder = true
synth = true
function_generator = true
audio_pwm = true

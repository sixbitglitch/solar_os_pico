schema = 1

# Clockwork PicoCalc fitted with a Pimoroni Pico Plus 2 W (RP2350B).
#
# Every pin and register in this file is sourced from clockworkpi's own
# repository (github.com/clockworkpi/PicoCalc) unless a comment says otherwise.
# See doc/ports/picocalc.md section "Hardware sources used" for the per-item
# citation and confidence level. Nothing here has been checked against real
# hardware - there was none available when this manifest was written.

[board]
id = "picocalc"
name = "Clockwork PicoCalc (Pico Plus 2 W)"
vendor = "Clockwork"
module = "Pimoroni Pico Plus 2 W (RP2350B, 16 MB flash, CYW43439)"

[target]
mcu = "rp2350"
# No platformio_board: this target is built through pico-sdk under
# targets/picocalc/, not PlatformIO. See doc/ports/picocalc.md section 1.
pico_board = "pimoroni_pico_plus2_w_rp2350"

[build]
drivers = [
  "uart_pico",
  "gpio_pico",
  "i2c_pico",
  "spi_pico",
  "adc_pico",
  "pwm_pico",
  "display_ili9488_picocalc",
  "storage_sd_spi_pico",
  "battery_picocalc",
]
capabilities = [
  "display", "gfx", "display_brightness", "streaming_display",
  "uart", "sd", "i2c", "spi", "gpio", "adc", "pwm", "key", "battery",
  "wifi", "audio", "psram",
  "expansion_gpio", "expansion_i2c", "expansion_spi", "expansion_uart",
  "expansion_adc", "expansion_pwm",
]
required_packages = []
# Pico Plus 2 W carries 8 MB APS6404 PSRAM on GPIO47. Declared so packages that
# require the psram capability (python/lua/gameboy/web) are not pruned. The
# pico port brings it up via hardware_psram and solar_os_psram_heap.
psram_bytes = 8388608

[header]
includes = ["solar_os_keys.h"]

[defines]
# --- Display: ST7365P (ILI9488-compatible) 320x320, spi1 ---------------------
# Current PicoCalc production panels are ST7365P. Older clockworkpi reference
# code treated them as ILI9488 in 18bpp (COLMOD 0x66); on-device ports that
# actually work (jeffory/PicOS) use RGB565 (COLMOD 0x55) with MADCTL 0x48.
# Forcing 0x66 on an ST7365P yields a black screen with sparse random pixels.
# Set COLMOD back to 0x66 only if you have a confirmed legacy ILI9488 unit.
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"ST7365P"'
SOLAR_OS_BOARD_DISPLAY_CONTROLLER_ILI9488 = "1"
SOLAR_OS_BOARD_DISPLAY_DRIVER_NAME = '"ili9488"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "320"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "320"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "320"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "320"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R0"
SOLAR_OS_BOARD_DISPLAY_COL_OFFSET = "0"
SOLAR_OS_BOARD_DISPLAY_ROW_OFFSET = "0"
# 0x48 = MX | BGR, matching PicOS / Picoware / vendor MADCTL.
SOLAR_OS_BOARD_DISPLAY_MADCTL = "0x48"
# Optical inversion. 1 = INVON (PicOS default). Set 0 if black/white look swapped.
SOLAR_OS_BOARD_DISPLAY_INVON = "0"
# 0x55 = 16bpp RGB565 (ST7365P). 0x66 = 18bpp RGB666 (legacy ILI9488 path).
SOLAR_OS_BOARD_DISPLAY_COLMOD = "0x55"
# Vendor default is 25 MHz; 50 MHz is the commented alternative in their
# lcdspi.h. Use 25 MHz until hardware_spi at higher rates is validated.
SOLAR_OS_BOARD_DISPLAY_SPI_CLOCK_HZ = "25000000"
SOLAR_OS_BOARD_PIN_LCD_SCK = "10"
SOLAR_OS_BOARD_PIN_LCD_MOSI = "11"
SOLAR_OS_BOARD_PIN_LCD_MISO = "12"
SOLAR_OS_BOARD_PIN_LCD_CS = "13"
SOLAR_OS_BOARD_PIN_LCD_DC = "14"
SOLAR_OS_BOARD_PIN_LCD_RST = "15"
# The LCD backlight is NOT on a Pico GPIO. It is driven by the STM32
# co-processor and set by writing register 0x05 (REG_ID_BKL) over the keyboard
# I2C link, in 16 steps (LCD_BACKLIGHT_STEP in the STM32 firmware's
# conf_app.h). Hence no SOLAR_OS_BOARD_PIN_LCD_BL here.
SOLAR_OS_BOARD_LCD_BACKLIGHT_I2C = "1"
SOLAR_OS_BOARD_LCD_BACKLIGHT_PULSE_STEPS = "0"
SOLAR_OS_BOARD_LCD_BACKLIGHT_STEP_PERCENT = "0"

# --- Keyboard / PMU co-processor (STM32F103, i2c1) --------------------------
# Address and bus speed from Code/picocalc_helloworld/i2ckbd/i2ckbd.h; the
# 10 kHz ceiling is a hard requirement noted in that header, not a default.
SOLAR_OS_BOARD_PIN_I2C_SDA = "6"
SOLAR_OS_BOARD_PIN_I2C_SCL = "7"
SOLAR_OS_BOARD_I2C_PORT = "1"
SOLAR_OS_BOARD_I2C_SPEED_HZ = "10000"
SOLAR_OS_BOARD_PICOCALC_KBD_ADDRESS = "0x1f"

# --- SD card (spi0) ---------------------------------------------------------
# From Code/MP3Player/config.h; these are also the Pico Plus 2 W's
# PICO_DEFAULT_SPI_* pins, which corroborates them.
SOLAR_OS_BOARD_SPI_HOST = "0"
SOLAR_OS_BOARD_SPI_NAME = '"spi0"'
SOLAR_OS_BOARD_PIN_SPI_SCLK = "18"
SOLAR_OS_BOARD_PIN_SPI_MOSI = "19"
SOLAR_OS_BOARD_PIN_SPI_MISO = "16"
SOLAR_OS_BOARD_PIN_SD_CS = "17"
# Card-detect pin from Code/pico_multi_booter/boot.c (SD_DET_PIN), active low
# with an internal pull-up.
SOLAR_OS_BOARD_PIN_SD_DETECT = "22"
SOLAR_OS_BOARD_SD_DETECT_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_SPI_MAX_TRANSFER_SZ = "4096"

# --- UART0 ------------------------------------------------------------------
SOLAR_OS_BOARD_UART_PORT = "0"
SOLAR_OS_BOARD_PIN_UART_TX = "0"
SOLAR_OS_BOARD_PIN_UART_RX = "1"

# --- Battery ----------------------------------------------------------------
# Reported by the STM32 co-processor from an AXP2101 PMU, read as register
# 0x0b (REG_ID_BAT). The value is a PERCENTAGE with bit 7 set while charging -
# not millivolts. See doc/ports/picocalc.md for how that is reconciled with
# solar_os_board_battery_sample_t.
SOLAR_OS_BOARD_BATTERY_VIA_PICOCALC_KBD = "1"

[runtime]
uart_ports = ["0", "1"]

# ---------------------------------------------------------------------------
# Pins
#
# "fixed" pins have a confirmed dedicated function on the PicoCalc mainboard.
#
# J703 (case side GPIO header) breaks out GP2/3/4/5/21/28. Those nets also run
# to the mainboard ESP-PSRAM64H (except GP28). With the Pico Plus 2 W this
# firmware uses the module's own PSRAM on GPIO47, so the mainboard chip stays
# idle while RAM_CS (GP20) is left alone — the side header is usable as GPIO.
#
# GPIO40-46 are Pico Plus 2 W module castellations, NOT routed through the
# PicoCalc 40-pin socket. Keep them free for programmatic use if reachable;
# they are not on the physical connector map below.
# ---------------------------------------------------------------------------
[[pins]]
gpio = 0
policy = "fixed"
role = "uart0 tx"

[[pins]]
gpio = 1
policy = "fixed"
role = "uart0 rx"

[[pins]]
gpio = 2
policy = "free"
expansion = true
user = true
pwm = true
role = "J703 GP2 (mainboard PSRAM IO)"

[[pins]]
gpio = 3
policy = "free"
expansion = true
user = true
pwm = true
role = "J703 GP3 (mainboard PSRAM IO)"

[[pins]]
gpio = 4
policy = "free"
expansion = true
user = true
pwm = true
role = "J703 GP4 (mainboard PSRAM IO)"

[[pins]]
gpio = 5
policy = "free"
expansion = true
user = true
pwm = true
role = "J703 GP5 (mainboard PSRAM IO)"

[[pins]]
gpio = 6
policy = "fixed"
role = "keyboard i2c sda"

[[pins]]
gpio = 7
policy = "fixed"
role = "keyboard i2c scl"

[[pins]]
gpio = 10
policy = "fixed"
role = "lcd spi sclk"

[[pins]]
gpio = 11
policy = "fixed"
role = "lcd spi mosi"

[[pins]]
gpio = 12
policy = "fixed"
role = "lcd spi miso"

[[pins]]
gpio = 13
policy = "fixed"
role = "lcd cs"

[[pins]]
gpio = 14
policy = "fixed"
role = "lcd dc"

[[pins]]
gpio = 15
policy = "fixed"
role = "lcd reset"

[[pins]]
gpio = 16
policy = "fixed"
role = "sd spi miso"

[[pins]]
gpio = 17
policy = "fixed"
role = "sd cs"

[[pins]]
gpio = 18
policy = "fixed"
role = "sd spi sclk"

[[pins]]
gpio = 19
policy = "fixed"
role = "sd spi mosi"

[[pins]]
gpio = 20
policy = "fixed"
role = "mainboard psram cs"

[[pins]]
gpio = 21
policy = "free"
expansion = true
user = true
pwm = true
role = "J703 GP21 (mainboard PSRAM SCK)"

[[pins]]
gpio = 22
policy = "fixed"
role = "sd card detect"

[[pins]]
gpio = 26
policy = "fixed"
role = "audio pwm left"

[[pins]]
gpio = 27
policy = "fixed"
role = "audio pwm right"

[[pins]]
gpio = 28
policy = "free"
expansion = true
user = true
pwm = true
role = "J703 GP28"

# Pico Plus 2 W extra castellations. ADC_BASE_PIN is 40 on RP2350B
# (PICO_RP2350A == 0), so GPIO40-46 are the ADC-capable pins. GPIO45 is the
# module's USER switch and GPIO47 is its PSRAM chip select, so both are
# excluded. Not present on the PicoCalc side header.
[[pins]]
gpio = 40
policy = "free"
expansion = true
user = true
adc = true
pwm = true
role = "module expansion (adc0)"

[[pins]]
gpio = 41
policy = "free"
expansion = true
user = true
adc = true
pwm = true
role = "module expansion (adc1)"

[[pins]]
gpio = 42
policy = "free"
expansion = true
user = true
adc = true
pwm = true
role = "module expansion (adc2)"

[[pins]]
gpio = 43
policy = "free"
expansion = true
user = true
adc = true
pwm = true
role = "module expansion (adc3)"

[[pins]]
gpio = 44
policy = "free"
expansion = true
user = true
adc = true
pwm = true
role = "module expansion (adc4)"

[[pins]]
gpio = 46
policy = "free"
expansion = true
user = true
adc = true
pwm = true
role = "module expansion (adc6)"

# ---------------------------------------------------------------------------
# Buses
# ---------------------------------------------------------------------------
[[buses]]
name = "i2c1"
protocol = "i2c"
port = 1
sda = 6
scl = 7
# 10 kHz is mandatory for the STM32 co-processor, per clockworkpi's own
# i2ckbd.h comment. Do not raise this.
speed_hz = 10000
sharing = "shared"

[[buses]]
name = "spi1"
protocol = "spi"
host = 1
sclk = 10
miso = 12
mosi = 11
cs = [13]
max_transfer_size = 4096
sharing = "exclusive"

[[buses]]
name = "spi0"
protocol = "spi"
host = 0
sclk = 18
miso = 16
mosi = 19
cs = [17]
max_transfer_size = 4096
sharing = "shared"

[[buses]]
name = "uart0"
protocol = "uart"
port = 0
tx = 0
rx = 1
baud_rate = 115200
sharing = "exclusive"

# ---------------------------------------------------------------------------
# Default expansion devices
# ---------------------------------------------------------------------------
[[devices]]
name = "keyboard0"
driver = "picocalc-kbd"

[devices.bindings]
i2c = "i2c1"
addr = 0x1f

[[devices]]
name = "audio0"
driver = "audio-pwm-pico"

[devices.bindings]
pwm = 26

# ---------------------------------------------------------------------------
# Physical connector map (io app / `expansion layout`)
#
# J703 is the case side GPIO socket (clockwork Mainboard V2.0 schematic;
# corroborated by jamesmunns/calc-riff and community pinouts). J702 is the
# adjacent debug/UART socket — shown for completeness; UART0 shares the CH340
# console path and UART1/USB belong to the STM32 co-processor.
# ---------------------------------------------------------------------------
[connector]
title = "J702 / J703 side sockets"
view = "left case edge, sockets facing out; pin 1 (3V3) at top, pin 8 (GND) at bottom; J702 left column, J703 right column"
rows = 8
columns = 2

[[connectors]]
connector = "J702"
position = 1
row = 0
column = 0
kind = "power"
label = "MCU 3V3"
[[connectors]]
connector = "J703"
position = 1
row = 0
column = 1
kind = "power"
label = "3V3"
[[connectors]]
connector = "J702"
position = 2
row = 1
column = 0
gpio = 1
kind = "gpio"
label = "UART0 RX"
[[connectors]]
connector = "J703"
position = 2
row = 1
column = 1
gpio = 2
kind = "gpio"
label = "GP2"
[[connectors]]
connector = "J702"
position = 3
row = 2
column = 0
gpio = 0
kind = "gpio"
label = "UART0 TX"
[[connectors]]
connector = "J703"
position = 3
row = 2
column = 1
gpio = 3
kind = "gpio"
label = "GP3"
[[connectors]]
connector = "J702"
position = 4
row = 3
column = 0
kind = "control"
label = "UART1 RX (STM32)"
[[connectors]]
